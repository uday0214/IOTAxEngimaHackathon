[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-data-scientist"
version = "0.1.0"
description = "Autonomous AI Data Scientist for Budget-Constrained Churn Prediction (Utkrishta 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.1.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "optuna>=3.4.0",
    "shap>=0.43.0",
    "google-genai>=0.1.1",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
