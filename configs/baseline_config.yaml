experiment_id: 1
model_family: "catboost"
description: "Baseline anchor run: Default CatBoostClassifier with raw features and 5-fold Stratified CV"

hyperparameters:
  depth: 6
  learning_rate: 0.05
  l2_leaf_reg: 3.0
  iterations: 1000
  early_stopping_rounds: 50
  bagging_temperature: 0.2
  random_strength: 1.0
  auto_class_weights: "None"
  random_seed: 42

features:
  enable_charge_ratios: false
  enable_tenure_cohorts: false
  enable_service_density: false
  enable_interaction_terms: false
  drop_low_importance_features: []
